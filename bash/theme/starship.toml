add_newline = true
command_timeout = 200
format = "$hostname[$directory$git_branch$git_status$python$php$kotlin$java]($style)$character"

[character]
error_symbol = "\n[✗](bold cyan)"
success_symbol = "\n[󰮯](bold cyan)"

[hostname]
ssh_only = false
format = "$hostname. [󰝰](bold cyan) "
disabled = false

[directory]
truncation_length = 4
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[python]
symbol = "󱔎 "
pyenv_prefix = ""

[php]

[kotlin]
symbol = " "

[java]
symbol = "☕"
