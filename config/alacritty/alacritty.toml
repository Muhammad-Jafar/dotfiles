general.import = ["~/.config/omarchy/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "JetBrainsMono Nerd Font Propo" }
bold = { family = "JetBrainsMono Nerd Font Propo" }
italic = { family = "JetBrainsMono Nerd Font Propo" }
size = 13

[scrolling]
multiplier = 7

[window]
padding.x = 8
padding.y = 8
decorations = "None"
opacity = 0.625
blur = false           # override by hyprland blur
dynamic_padding = true

[cursor]
style = { shape = "Underline", blinking = "Always" }
blink_interval = 500
vi_mode_style = { shape = "Beam", blinking = "Always" }
unfocused_hollow = true
thickness = 0.25

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Shift", chars = "\u001B\r" },
]

[terminal]
osc52 = "CopyPaste"
