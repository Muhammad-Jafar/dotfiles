general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "CaskaydiaMono Nerd Font Propo" }
bold = { family = "CaskaydiaMono Nerd Font Propo" }
italic = { family = "CaskaydiaMono Nerd Font Propo" }
size = 13

[window]
padding.x = 8
padding.y = 8
decorations = "None"
opacity = 0.725
blur = true
dynamic_padding = true

[cursor]
style = { shape = "Underline", blinking = "On" }
vi_mode_style = { shape = "Underline", blinking = "On" }
unfocused_hollow = false

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]
