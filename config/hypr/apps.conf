# Add support to custom app launch

windowrule = float, class:yazi
windowrule = size 87% 80%, class:yazi

windowrule = float, class:rmpc
windowrule = size 65% 65%, class:rmpc

windowrule = float, class:bluetui

windowrule = opacity 1.0 1.0, class:^(jetbrains-phpstorm|jetbrains-idea|jetbrains-pycharm)

layerrule = blur, walker
layerrule = ignorezero, walker
layerrule = ignorealpha 0.4, walker
