source = ~/.config/omarchy/current/theme/hyprlock.conf

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
}

image {
    monitor =
    path = ~/dotfiles/images/notion-profile.png
    size = 180

    position = 0, 200
    halign = center
    valign = center
}


label {
    monitor = 
    text =   Programmer | 󱉟 Literature |  Adventure
    font_size = 18
    font_family = CaskaydiaMono Nerd Font Propo

    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 70
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 2

    font_family = CaskaydiaMono Nerd Font Propo
    font_color = $font_color

    placeholder_text = Confirm your self 󰈷
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 12
    shadow_passes = 0
    fade_on_empty = false
    
    dots_center = true
}

auth {
    fingerprint:enabled = true
}
