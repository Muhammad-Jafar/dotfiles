source = ~/.config/omarchy/current/theme/hyprlock.conf

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A, %d.%m.%y')" </big></b>"
    color = $secondary
    font_size = 21
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -30
    halign = center
    valign = top
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $on_secondary_container
    font_size = 48
    font_family = JetBrainsMono Nerd Font Propo
    shadow_passes = 0
    shadow_size = 0

    position = 0, -65
    halign = center
    valign = top
}

label {
    monitor =
    text = Where did you go? lets craft more
    color = rgba(255,255,255,0.725)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -65
    halign = center
    valign = center
}

shape {
    monitor =
    color = rgba(255,255,255,0.25)
    size = 180, 3
    rounding = 99

    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    position = 0, -140
    halign = center
    valign = center

    #inner_color = $inner_color
    inner_color = rgba(20, 20, 20, 0.4)
    outer_color = $outer_color
    outline_thickness = 0

    font_family = JetBrainsMono Nerd Font Propo
    font_color = $font_color

    placeholder_text = Confirm your self
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 12
    shadow_passes = 0
    fade_on_empty = false

    dots_center = true
}

auth {
    fingerprint:enabled = true
}
