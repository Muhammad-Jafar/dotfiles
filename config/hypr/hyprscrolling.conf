general {
    layout = scrolling
  }

plugin {
  hyprscrolling {
      column_width = .6
      fullscreen_on_one_column = true
      explicit_column_widths = .5, .6, .8, 1
      focus_fit_method = 0
      follow_focus = true
  }
}

input {
  follow_mouse = 0
}

bind = SUPER CTRL, P, layoutmsg, promote
bind = SUPER CTRL, R, layoutmsg, colresize +conf
